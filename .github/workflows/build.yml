name: Build and Release DT SMS Forwarder APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Inspect Built APK
        run: |
          echo "=== Built Release APK Details ==="
          ls -lh app/build/outputs/apk/release/
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            FILE_SIZE=$(stat -c%s "$APK_FILE")
            echo "APK Path: $APK_FILE"
            echo "Size (Bytes): $FILE_SIZE"
            echo "Size (MB): $(awk "BEGIN {print $FILE_SIZE/1048576}") MB"
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DT-SMS-Forwarder-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
